<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Negros Oriental Eco-Trails - Guide Booking Inquiry</title>
    <meta name="description"
        content="Book licensed local eco-guides for guided hikes across Mt. Talinis, Casaroro Falls, and Twin Lakes.">
    <meta name="author" content="Pierre Phil D. Bangay">

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <meta property="og:title" content="Book a Local Eco-Guide">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://pdumaran.github.io/wdd231/final/images/hero-mt-talinis.webp">
    <meta property="og:url" content="https://pdumaran.github.io/wdd231/final/booking.html">
    <meta property="og:description" content="Submit a guide booking query for guided outdoor hikes.">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script src="scripts/main.js" defer></script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.webp" alt="Eco-Trails Logo" width="50" height="50" loading="lazy">
            <span class="site-title">Negros Oriental Eco-Trails</span>
        </div>
        <button id="menu-toggle" aria-label="Toggle Navigation Menu">☰</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="trails.html">Explore Trails</a></li>
                <li><a href="booking.html" class="active">Book Guide</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Request a Licensed Local Guide</h1>
        <div class="form-container">
            <form method="get" action="thanks.html">
                <div class="form-group">
                    <label for="fullname">Full Name *</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Juan Dela Cruz">
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required placeholder="juan@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="09171234567">
                </div>

                <div class="form-group">
                    <label for="trail-select">Select Trail Target *</label>
                    <select id="trail-select" name="trail" required>
                        <option value="">-- Choose a Trail --</option>
                        <option value="Casaroro Falls Trail">Casaroro Falls Trail</option>
                        <option value="Mt. Talinis Summit">Mt. Talinis Summit</option>
                        <option value="Twin Lakes Nature Trail">Balinsasayao Twin Lakes</option>
                        <option value="Pulangbato Thermal Falls">Pulangbato Thermal Falls</option>
                        <option value="Other Trail">Other Eco-Trail</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="hike-date">Target Hike Date *</label>
                    <input type="date" id="hike-date" name="hike_date" required>
                </div>

                <div class="form-group">
                    <label for="group-size">Group Size</label>
                    <input type="number" id="group-size" name="group_size" min="1" max="25" value="1">
                </div>

                <div class="form-group">
                    <label for="notes">Special Requirements / Notes</label>
                    <textarea id="notes" name="notes" rows="4"
                        placeholder="Mention any medical concerns or equipment rental needs..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Submit Guide Request</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub Profile">
                <img src="images/github.svg" alt="GitHub Logo" width="30" height="30">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn Profile">
                <img src="images/linkedin.svg" alt="LinkedIn Logo" width="30" height="30">
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="X Twitter Profile">
                <img src="images/twitter.svg" alt="X Twitter Logo" width="30" height="30">
            </a>
        </div>
        <p>&copy; <span id="currentyear"></span> | Pierre Phil D. Bangay | Negros Oriental Eco-Trails</p>
        <p><a href="attributions.html">Resource Attributions</a></p>
        <p><a href="https://youtu.be/example" target="_blank" rel="noopener" class="video-link">📹 Watch Project
                Demonstration Video</a></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
